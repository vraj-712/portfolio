<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 512 512"
     width="512"
     height="512">

  <!-- Background -->
  <rect width="512" height="512" fill="#0B0F19"/>

  <!-- Cyan registration frame -->
  <rect
      x="20"
      y="20"
      width="472"
      height="472"
      fill="none"
      stroke="#22D3EE"
      stroke-width="2"/>

  <defs>
    <!-- Fine risograph dot texture -->
    <pattern id="risoDots"
             width="6"
             height="6"
             patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#22D3EE"/>
      <circle cx="1.2" cy="1.2" r="0.55" fill="#0B0F19"/>
      <circle cx="4.2" cy="3.6" r="0.55" fill="#0B0F19"/>
      <circle cx="2.8" cy="5.0" r="0.55" fill="#0B0F19"/>
    </pattern>

    <!-- VP Monogram -->
    <path id="vpShape"
      d="
      M95 140
      L155 380
      L205 380
      L255 140
      L210 140
      L180 305
      L145 140
      Z

      M280 140
      L395 140
      L430 175
      L430 260
      L395 295
      L330 295
      L330 380
      L280 380
      Z

      M330 185
      L330 250
      L382 250
      L382 185
      Z
      "/>
  </defs>

  <!-- Off-white misprint offset -->
  <use href="#vpShape"
       transform="translate(4 4)"
       fill="none"
       stroke="#E8E8E8"
       stroke-width="3"
       stroke-linejoin="miter"/>

  <!-- Main VP -->
  <use href="#vpShape"
       fill="url(#risoDots)"/>

  <!-- Registration mark -->
  <g
      transform="translate(430 82)"
      stroke="#22D3EE"
      stroke-width="2"
      fill="none">
    <circle r="20"/>
    <line x1="-32" y1="0" x2="32" y2="0"/>
    <line x1="0" y1="-32" x2="0" y2="32"/>
  </g>

</svg>
